name: astrbot_plugin_text_moderation
desc: |
  📝 智能文本审核插件，支持关键词检测 + AI 语义分析双重检测。

  ✨ 功能特性：
  • 分级管控：严重违规(BLOCK)撤回+禁言/踢人，轻度违规(WARNING)仅警告
  • AI 自动学习：AI 发现违规词自动加入词库，越用越快
  • 智能语境判断：白名单词根据上下文判断（"喜欢萝莉"安全，"草萝莉"违规）
  • 隐晦表达识别：谐音、拆字、拼音等绕过手段
  • 阴阳怪气识别：识别不骂脏话但贬低人的人身攻击（对事不对人=放过，对人=违规）
  • Token 计量：自动统计 AI 调用量，支持 DeepSeek/OpenAI/Claude 等多模型价格换算
  • 管理员权限：清空违规记录等命令需要管理员权限
  • 违规记录持久化：保存到本地文件，重启不丢失
  • 私信通知：违规时自动私信通知管理员
  • WebUI 四标签页：违禁词管理、违规记录、管理员设置、API消耗统计

  ⚙️ 配置项：AI模型、群号白名单、审核开关、惩罚规则、管理员列表、Token计费模型等均可在UI修改
display_name: 文本审核插件
